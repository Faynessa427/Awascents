<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="contact.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Awascents</title>
    <script src="redo.js" defer></script>
  </head>
  <body>
    <header class="bar">
    <a class="brand" href="index.html" aria-label="Awascents home">
      <img src="Awascentslogo.png" alt="">
      <span>Awascents</span>
    </a>
    <div class="menu-wrap">
      <button class="menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="menu-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="visit.html"> Shop here</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact Us</a>
        <a href="terms.html">Terms of use</a>
      </nav>
    </div>
  </header>
  <main>
    <header class="page-heading">
      <p class="eyebrow">We’re here to help</p>
      <p>Questions about a fragrance or your order? Send us a note and we’ll be glad to help.</p>
    </header>
    <form class="content" id="contact-form">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" placeholder="Name" required>
      <label for="email">Your email</label>
      <input type="email" id="email" name="email" placeholder="Email address" required>
      <label for="textarea">Message</label>
      <textarea id="textarea" name="message" rows="6" required></textarea>
      <p id="messageError" role="status" aria-live="polite"></p>
      <button id="button" type="submit">Send message <span aria-hidden="true">↗</span></button>
    </form>
  </main>
      <div class="bottom-contact-details">
     <h4> Phone number:<br>
        000-0000-0000 </h4>

      <h4>Email Address:<br>
        <a href="mailto:Awascents@gmail.com">Awascents@gmail.com</a></h4>
      
      <h4> @ All socials-media platforms:<br>
           @Awascents_fragrance.</h4>
    </div>

    <script src="contact.js"></script>
  </body>
</html>
